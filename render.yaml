services:
  - type: web
    name: wardr-threat-network
    runtime: docker
    dockerfilePath: ./deploy/threat-network/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /v1/health
    domains:
      - api.getwardr.com
    envVars:
      - key: WARDR_ADMIN_TOKEN
        generateValue: true
    disk:
      name: wardr-data
      mountPath: /data
      sizeGB: 5

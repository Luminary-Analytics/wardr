name: Wardr live release smoke
run-name: Wardr live upgrade ${{ inputs.baseline }} to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Previous signed release offered by getwardr.com
        required: true
        type: string
      target:
        description: Release currently offered by the getwardr.com update feed
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    uses: ./.github/workflows/windows-live-release.yml
    with:
      baseline: ${{ inputs.baseline }}
      target: ${{ inputs.target }}

  macos-linux:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos, arch: arm64, runner: macos-15}
          - {platform: macos, arch: x64, runner: macos-15-intel}
          - {platform: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {platform: linux, arch: x64, runner: ubuntu-24.04}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install the detached signature verifier
        run: python -m pip install cryptography==50.0.2
      - name: Enable Gatekeeper assessments on the hosted Mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! spctl --status 2>&1 | grep -qx 'assessments enabled'; then
            sudo -n spctl --global-enable 2>/dev/null || sudo -n spctl --master-enable
          fi
      - name: Verify the native installer and upgrade from the live feed
        shell: bash
        env:
          WARDR_BASELINE: ${{ inputs.baseline }}
          WARDR_TARGET: ${{ inputs.target }}
          WARDR_PLATFORM: ${{ matrix.platform }}
          WARDR_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF" != "refs/tags/v$WARDR_TARGET" ]]; then
            echo 'The workflow tag must match the target release version.' >&2
            exit 1
          fi
          bash "tests/smoke_${WARDR_PLATFORM}_release.sh" "$WARDR_ARCH" "$WARDR_BASELINE" "$WARDR_TARGET"

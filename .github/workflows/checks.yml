name: Wardr checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install a release wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          wardr --help
      - run: python -m unittest discover -s tests -v
      - name: Native collectors and report exports
        shell: bash
        run: |
          python -m wardr --state-dir .wardr-ci scan --format json > scan.json
          python -m wardr --state-dir .wardr-ci exposure > exposure.json
          python -m wardr --state-dir .wardr-ci plan --format json > plan.json
          python -c 'import json; from pathlib import Path; scan, exposure, plan = [json.loads(Path(name).read_text(encoding="utf-8")) for name in ("scan.json", "exposure.json", "plan.json")]; assert scan["checks"] and exposure["coverage"] and plan["sources"]'

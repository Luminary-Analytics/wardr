name: Bug Report
description: Report a reproducible bug or unexpected behavior in Wardr (not for security vulnerabilities).
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security notice:** If you found a security vulnerability in Wardr, **do not submit this form**. Use the [private security advisory form](https://github.com/Luminary-Analytics/wardr/security/advisories/new) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wardr version
      placeholder: "e.g. 0.4.2 (run `wardr --version`)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Linux (x64)
        - Linux (ARM64)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands or UI steps. Scrub hostnames, tokens, keys, and personal data before pasting logs.
      placeholder: |
        1. Run `wardr ...`
        2. Observe ...
    validations:
      required: true
